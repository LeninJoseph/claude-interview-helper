site_name: Python Interview Handbook
site_description: One-stop, high-level Python interview preparation — Python, APIs, databases, design patterns, data modeling, DSA and system design.
site_author: Lenin
site_url: https://leninjoseph.github.io/claude-interview-helper/
repo_url: https://github.com/LeninJoseph/claude-interview-helper
repo_name: LeninJoseph/claude-interview-helper
edit_uri: edit/main/docs/
copyright: Built for interview prep · MIT License

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    logo: material/language-python

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.mark
  - pymdownx.keys

nav:
  - Home: index.md
  - Python:
      - python/index.md
      - Fundamentals & Data Types: python/fundamentals.md
      - Functions & Scope: python/functions.md
      - OOP: python/oop.md
      - Advanced Python: python/advanced.md
      - Internals & Memory: python/internals.md
      - Concurrency & Async: python/concurrency.md
      - Testing, Typing & Tooling: python/testing-tooling.md
      - Python Q&A Bank: python/questions.md
  - APIs:
      - api/index.md
      - HTTP & REST Fundamentals: api/rest.md
      - FastAPI & Django REST: api/frameworks.md
      - Auth & Security: api/security.md
      - API Q&A Bank: api/questions.md
  - Databases:
      - database/index.md
      - SQL & Queries: database/sql.md
      - Indexing, Transactions & Performance: database/internals.md
      - NoSQL & Caching: database/nosql.md
      - ORM (SQLAlchemy / Django): database/orm.md
      - Database Q&A Bank: database/questions.md
  - Design:
      - design/index.md
      - SOLID & Principles: design/principles.md
      - Design Patterns: design/patterns.md
      - Data Modeling: design/data-modeling.md
      - System Design: design/system-design.md
  - DSA:
      - dsa/index.md
      - Complexity & Big-O: dsa/complexity.md
      - Data Structures: dsa/data-structures.md
      - Algorithms: dsa/algorithms.md
      - Problem Patterns: dsa/patterns.md
  - Revision Cheatsheet: cheatsheet.md
